name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - name: Design guard
        run: python tools/check.py
      - name: Generated pages are up to date
        run: |
          python tools/build.py
          git diff --exit-code -- index.html fr/index.html 404.html sitemap.xml
