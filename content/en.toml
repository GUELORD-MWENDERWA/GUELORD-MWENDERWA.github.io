[[about.principles]]
title = "Verify against a reference."
text = "Numerical code is checked against analytical results or established libraries, and firmware logic is unit-tested on the host before it reaches hardware."

[[about.principles]]
title = "Make the model and the device agree."
text = "When an algorithm is trained on a computer and deployed on a microcontroller, a test proves that both compute the same thing."

[[about.principles]]
title = "Mockups before code."
text = "Every screen is drawn at phone and desktop widths before it is built, with real content from the domain."

[[about.principles]]
title = "State limits honestly."
