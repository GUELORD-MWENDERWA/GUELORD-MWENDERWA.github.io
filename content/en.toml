[highlights]
index = "03 — Highlights"
title = "Problems I have solved"
intro = "The constraints of the field shape the engineering: unstable networks, two currencies, shared phones and modest servers."

[[highlights.items]]
project = "Mwangaza"
title = "Receipts without a server"
text = "A school cash desk keeps taking payments during network cuts. Receipts are numbered on the device and synchronised with idempotent writes when the connection comes back."

[[highlights.items]]
project = "Mwangaza"
title = "Money without rounding errors"
text = "Amounts are stored as integers, in cents and francs, with an explicit exchange rate. Payments are immutable: a correction is a new record, never an edit."

[[highlights.items]]
project = "Mwangaza"
title = "Many schools, one database, no leaks"
text = "Every query is scoped to its school, and PostgreSQL Row Level Security enforces it again underneath, with tests that try to read another school's data."

[[highlights.items]]
project = "Lab automation"
title = "A computer lab that runs itself"
text = "An ESP32 handles dual RFID access, occupancy counting, energy metering, daylight-aware lighting and night-time intrusion detection, in eleven firmware modules."

[[highlights.items]]
project = "PID control"
title = "A controller proven before the board"
text = "The PID that drives a DC motor is unit-tested on the computer against a motor model, anti-windup included, before it is flashed to the Arduino."

[[highlights.items]]
project = "Edge AI"
title = "A neural network on a microcontroller"
text = "A 172-parameter model diagnoses motor faults on an ESP32, and a parity test proves that the firmware computes what the model learned in Python."

