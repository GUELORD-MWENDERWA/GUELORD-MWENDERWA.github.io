[[about.principles]]
title = "Faire concorder le modèle et l'appareil."
text = "Quand un algorithme est entraîné sur un ordinateur puis déployé sur un microcontrôleur, un test prouve que les deux calculent la même chose."

[[about.principles]]
title = "La maquette avant le code."
text = "Chaque écran est dessiné pour le téléphone et l'ordinateur avant d'être construit, avec le vrai contenu du métier."

[[about.principles]]
title = "Dire honnêtement les limites."
text = "Chaque projet dit ce qui a été validé et ce qui ne l'a pas été."

