[highlights]
index = "02 — Points forts"
title = "Des problèmes que j'ai résolus"
intro = "Les contraintes du terrain façonnent la technique : réseau instable, deux monnaies, téléphones partagés et serveurs modestes."

[[highlights.items]]
project = "Mwangaza"
title = "Des reçus sans serveur"
text = "La caisse d'une école continue d'encaisser pendant les coupures. Les reçus sont numérotés sur l'appareil, puis synchronisés par des écritures idempotentes au retour de la connexion."

[[highlights.items]]
project = "Mwangaza"
title = "De l'argent sans erreur d'arrondi"
text = "Les montants sont gardés en entiers, en centimes et en francs, avec un taux de change explicite. Un paiement ne se modifie jamais : une correction est un nouvel enregistrement."

[[highlights.items]]
project = "Mwangaza"
title = "Plusieurs écoles, une base, aucune fuite"
text = "Chaque requête est limitée à son école, et la Row Level Security de PostgreSQL le vérifie encore en dessous, avec des tests qui essaient de lire les données d'une autre école."

[[highlights.items]]
project = "Mwangaza"
title = "Le bulletin officiel"
text = "Les bulletins reproduisent le formulaire national de l'EPST avec un QR d'authenticité, ou impriment seulement les notes sur les feuilles pré-imprimées de l'école."

[[highlights.items]]
project = "Mwangaza"
title = "Rapide sur un serveur modeste"
text = "Les performances sont mesurées avant et après chaque changement : les travaux lourds passent par des files, et les écrans restent rapides avec mille élèves."

[[highlights.items]]
project = "Edge AI"
title = "Un réseau de neurones sur un microcontrôleur"
text = "Un modèle de 172 paramètres diagnostique les pannes d'un moteur sur un ESP32, et un test de parité prouve que le firmware calcule ce que le modèle a appris en Python."

